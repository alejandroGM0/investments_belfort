[project]
name = "belfort"
version = "0.1.0"
description = "Crypto investment analysis engine: TA patterns, backtest grid, CLI and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data ingestion
    "ccxt>=4.4",
    "pyarrow>=15.0",

    # Technical analysis (primary: TA-Lib; fallback: pandas-ta-classic)
    "pandas-ta-classic>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",

    # Chart patterns & market structure
    # chart-patterns is installed from GitHub (not on PyPI):
    # uv pip install git+https://github.com/zeta-zetra/chart_patterns.git
    "scipy>=1.13",
    "scikit-learn>=1.4",

    # Backtest
    "vectorbt>=0.26",

    # Storage
    "duckdb>=0.10",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # CLI
    "typer>=0.12",
    "rich>=13.0",
    "mplfinance>=0.12",

    # Scheduler
    "apscheduler>=3.10",

    # Misc
    "python-dotenv>=1.0",
    "aiofiles>=23.0",

    # Sentiment (F2)
    "praw>=7.7",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "textblob>=0.18",
    "diskcache>=5.6",
    "pydantic>=2.0",
    "cachetools>=5.3",
]

[project.optional-dependencies]
talib = ["TA-Lib>=0.4"]
sentiment-apis = ["sanpy>=0.12"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.35",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
    "openapi-spec-validator>=0.7",
]

[project.scripts]
belfort = "belfort.cli.__main__:app"
belfort-api = "belfort.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/belfort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = true
