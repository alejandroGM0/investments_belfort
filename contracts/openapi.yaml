openapi: 3.1.0
info:
  title: Investments Belfort API
  version: "1.0"
  description: API contract for the crypto investment analysis platform.

servers:
  - url: http://localhost:8000
    description: Local gateway

paths:
  /ticker/{symbol}:
    get:
      operationId: getTicker
      summary: Live spot price from Binance
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Live ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickerResponse"

  /tickers:
    get:
      operationId: getTickers
      summary: Live prices for multiple symbols
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated symbols
      responses:
        "200":
          description: Batch tickers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TickersResponse"

  /ohlcv/{symbol}:
    get:
      operationId: getOhlcv
      summary: Get OHLCV candlestick data
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
        - name: history
          in: query
          schema:
            type: string
            enum: [2y, 5y, max]
            default: 5y
        - name: live
          in: query
          schema:
            type: boolean
            default: true
            description: Refresh latest candles from Binance before respond
      responses:
        "200":
          description: OHLCV data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OhlcvResponse"

  /analysis/{symbol}:
    get:
      operationId: getAnalysis
      summary: Get technical analysis for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Technical analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"

  /analysis/{symbol}/chart-markers:
    get:
      operationId: getChartMarkers
      summary: Get chart annotation markers for viewport
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: history
          in: query
          schema:
            $ref: "#/components/schemas/HistoryDepth"
        - name: from
          in: query
          schema:
            type: integer
        - name: to
          in: query
          schema:
            type: integer
        - name: min_confidence
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0.35
        - name: pattern_status
          in: query
          schema:
            $ref: "#/components/schemas/ChartPatternStatusFilter"
        - name: pattern_direction
          in: query
          schema:
            $ref: "#/components/schemas/ChartPatternDirectionFilter"
        - name: categories
          in: query
          description: Comma-separated pattern categories (e.g. candles,trend) or omit for all
          schema:
            type: string
        - name: max_markers
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 200
            default: 80
      responses:
        "200":
          description: Chart markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartMarker"

  /analysis/{symbol}/chart-overlays:
    get:
      operationId: getChartOverlays
      summary: Projection path, EMA, levels and trade setup for chart
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: history
          in: query
          schema:
            $ref: "#/components/schemas/HistoryDepth"
        - name: projection_bars
          in: query
          schema:
            type: integer
            minimum: 4
            maximum: 48
            default: 16
        - name: min_level_strength
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
            default: 0
        - name: max_levels_per_side
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
        - name: min_confluence
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 0
      responses:
        "200":
          description: Chart overlay bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartOverlaysResponse"

  /analysis/{symbol}/operational-setup:
    get:
      operationId: getOperationalSetup
      summary: Exhaustive operational setup with probabilities, ETA and evidence
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: history
          in: query
          schema:
            $ref: "#/components/schemas/HistoryDepth"
      responses:
        "200":
          description: Operational setup analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalSetupResponse"

  /sentiment/{symbol}:
    get:
      operationId: getSentiment
      summary: Get social sentiment for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: ["1h", "4h", "24h", "7d"]
            default: "24h"
      responses:
        "200":
          description: Sentiment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentResponse"

  /news/{symbol}:
    get:
      operationId: getNews
      summary: Get news for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sentiment
          in: query
          schema:
            type: string
            enum: ["positive", "negative", "neutral", "all"]
            default: "all"
      responses:
        "200":
          description: News items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"

  /backtest/{symbol}:
    get:
      operationId: getBacktest
      summary: Get backtest results for a symbol and strategy
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: strategy
          in: query
          schema:
            type: string
            default: "v1"
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResponse"

  /backtest/{symbol}/runs:
    get:
      operationId: getBacktestRuns
      summary: Paginated history of all saved backtest grid combos
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: pattern_id
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            default: sharpe
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Backtest run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestRunsResponse"

  /backtest/{symbol}/refresh:
    post:
      operationId: refreshBacktest
      summary: Trigger a backtest refresh (quick or full grid)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: mode
          in: query
          schema:
            type: string
            enum: ["quick", "full"]
            default: "quick"
      responses:
        "200":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"

  /analysis/{symbol}/patterns/all:
    get:
      operationId: getPatternsAll
      summary: Get all patterns with active/recent/inactive status
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: history
          in: query
          schema:
            $ref: "#/components/schemas/HistoryDepth"
      responses:
        "200":
          description: All patterns with status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternsAllResponse"

  /analysis/{symbol}/refresh:
    post:
      operationId: refreshAnalysis
      summary: Trigger analysis data refresh
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
      responses:
        "200":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"

  /symbols/{symbol}/init:
    post:
      operationId: initSymbol
      summary: Cold-start orchestrator — fetch data + quick backtest
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: history
          in: query
          schema:
            $ref: "#/components/schemas/HistoryDepth"
      responses:
        "200":
          description: Jobs queued for initialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitResponse"

  /jobs/{job_id}:
    get:
      operationId: getJob
      summary: Get job status and progress
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"

  /jobs:
    get:
      operationId: listJobs
      summary: List recent jobs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobResponse"

  /ranking:
    get:
      operationId: getRanking
      summary: Get ranking of crypto assets by clarity score
      parameters:
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
        - name: symbols
          in: query
          schema:
            type: string
            description: Comma-separated list of symbols to include
      responses:
        "200":
          description: Ranking list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingResponse"

  /context/{symbol}:
    get:
      operationId: getContext
      summary: Get market context (correlations; events when configured)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
      responses:
        "200":
          description: Context data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"

  /dashboard/{symbol}:
    get:
      operationId: getDashboard
      summary: Get aggregated dashboard data for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: tf
          in: query
          schema:
            $ref: "#/components/schemas/Timeframe"
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

components:
  schemas:
    Timeframe:
      type: string
      enum: ["1h", "4h", "1D", "1W"]

    HistoryDepth:
      type: string
      enum: ["2y", "5y", "max"]
      default: "5y"

    TrendDirection:
      type: string
      enum: ["bullish", "bearish", "neutral"]

    PatternDirection:
      type: string
      enum: ["bull", "bear", "neutral"]

    PatternCategory:
      type: string
      enum:
        [
          "candles",
          "chart_patterns",
          "trend",
          "structure",
          "indicators",
          "levels",
        ]

    SentimentTone:
      type: string
      enum: ["positive", "negative", "neutral", "mixed"]

    OhlcvCandle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    OhlcvResponse:
      type: object
      required: [symbol, tf, candles]
      properties:
        symbol:
          type: string
        tf:
          $ref: "#/components/schemas/Timeframe"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/OhlcvCandle"
        last_candle_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
        live:
          type: boolean

    TickerResponse:
      type: object
      required: [symbol, price, updated_at]
      properties:
        symbol:
          type: string
        price:
          type: number
        bid:
          type: number
          nullable: true
        ask:
          type: number
          nullable: true
        change_24h_pct:
          type: number
          nullable: true
        high_24h:
          type: number
          nullable: true
        low_24h:
          type: number
          nullable: true
        volume_24h:
          type: number
          nullable: true
        updated_at:
          type: string
          format: date-time

    TickersResponse:
      type: object
      required: [tickers, updated_at]
      properties:
        tickers:
          type: array
          items:
            $ref: "#/components/schemas/TickerResponse"
        updated_at:
          type: string
          format: date-time

    PatternItem:
      type: object
      required: [id, name, category, direction, bar_time, confidence, active]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/PatternCategory"
        direction:
          $ref: "#/components/schemas/PatternDirection"
        bar_time:
          type: integer
        confidence:
          type: number
          minimum: 0
          maximum: 1
        active:
          type: boolean
        description:
          type: string
        tf:
          $ref: "#/components/schemas/Timeframe"
        highlight:
          type: boolean
          default: false

    IndicatorItem:
      type: object
      required: [name, value, signal]
      properties:
        name:
          type: string
        value:
          type: number
        signal:
          $ref: "#/components/schemas/TrendDirection"
        zone:
          type: string
          enum: ["overbought", "oversold", "neutral"]
        description:
          type: string

    Level:
      type: object
      required: [price, type, strength]
      properties:
        price:
          type: number
        type:
          type: string
          enum: ["support", "resistance"]
        strength:
          type: number
          minimum: 0
          maximum: 1

    TradeSetup:
      type: object
      properties:
        entry:
          type: number
        stop_loss:
          type: number
        take_profit:
          type: number
        risk_reward:
          type: number
        direction:
          $ref: "#/components/schemas/TrendDirection"

    PatternGroup:
      type: object
      required: [category, count, items]
      properties:
        category:
          $ref: "#/components/schemas/PatternCategory"
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/PatternItem"

    AnalysisSummary:
      type: object
      required: [trend, confluence_score, highlights]
      properties:
        trend:
          $ref: "#/components/schemas/TrendDirection"
        trend_strength:
          type: integer
          minimum: 0
          maximum: 100
        confluence_score:
          type: integer
          minimum: 0
          maximum: 100
        highlights:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PatternItem"
        trade_setup:
          $ref: "#/components/schemas/TradeSetup"
        timeframe_analysis:
          type: object
          additionalProperties:
            type: object
            properties:
              trend:
                $ref: "#/components/schemas/TrendDirection"
              strength:
                type: integer

    AnalysisResponse:
      type: object
      required: [symbol, tf, updated_at, summary, groups, indicators, levels]
      properties:
        symbol:
          type: string
        tf:
          $ref: "#/components/schemas/Timeframe"
        updated_at:
          type: string
          format: date-time
        summary:
          $ref: "#/components/schemas/AnalysisSummary"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PatternGroup"
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorItem"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/Level"
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    ChartPatternStatusFilter:
      type: string
      enum: [highlight, active, recent, active_recent, all]
      default: active_recent

    ChartPatternDirectionFilter:
      type: string
      enum: [all, bull, bear]
      default: all

    ChartMarker:
      type: object
      required: [time, position, shape, color, text]
      properties:
        time:
          type: integer
        position:
          type: string
          enum: ["aboveBar", "belowBar", "inBar"]
        shape:
          type: string
          enum: ["arrowUp", "arrowDown", "circle", "square"]
        color:
          type: string
        text:
          type: string
        pattern_id:
          type: string

    ChartProjectionPoint:
      type: object
      required: [time, value]
      properties:
        time:
          type: integer
        value:
          type: number

    ChartProjection:
      type: object
      required: [direction, target_price, bars, path, candles]
      properties:
        direction:
          $ref: "#/components/schemas/TrendDirection"
        target_price:
          type: number
        bars:
          type: integer
        path:
          type: array
          items:
            $ref: "#/components/schemas/ChartProjectionPoint"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/OhlcvCandle"

    EmaSeries:
      type: object
      required: [period, points]
      properties:
        period:
          type: integer
        points:
          type: array
          items:
            $ref: "#/components/schemas/ChartProjectionPoint"

    ChartOverlaysResponse:
      type: object
      required: [symbol, tf, trend, confluence_score, ema, levels]
      properties:
        symbol:
          type: string
        tf:
          $ref: "#/components/schemas/Timeframe"
        trend:
          $ref: "#/components/schemas/TrendDirection"
        confluence_score:
          type: integer
        projection:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChartProjection"
        ema:
          type: array
          items:
            $ref: "#/components/schemas/EmaSeries"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/Level"
        trade_setup:
          $ref: "#/components/schemas/TradeSetup"

    OperationalProbability:
      type: object
      required: [win, loss, low, high, confidence, sample_size, source]
      properties:
        win:
          type: number
          minimum: 0
          maximum: 1
        loss:
          type: number
          minimum: 0
          maximum: 1
        low:
          type: number
          minimum: 0
          maximum: 1
        high:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: string
          enum: [low, medium, high]
        sample_size:
          type: integer
        source:
          type: string
          enum: [backtest_adjusted, technical_proxy]
        historical_win_rate:
          type: number
          nullable: true

    OperationalExpectancy:
      type: object
      required: [r, return_pct, label]
      properties:
        r:
          type: number
        return_pct:
          type: number
        label:
          type: string
          enum: [positive, neutral, negative]

    OperationalTimeEstimate:
      type: object
      required:
        [
          tp_bars_min,
          tp_bars_median,
          tp_bars_max,
          tp_human,
          sl_bars_median,
          sl_human,
          confidence,
          atr,
          atr_pct,
          tp_distance_atr,
          sl_distance_atr,
        ]
      properties:
        tp_bars_min:
          type: integer
        tp_bars_median:
          type: integer
        tp_bars_max:
          type: integer
        tp_human:
          type: string
        sl_bars_median:
          type: integer
        sl_human:
          type: string
        confidence:
          type: string
          enum: [low, medium, high]
        atr:
          type: number
        atr_pct:
          type: number
        tp_distance_atr:
          type: number
        sl_distance_atr:
          type: number

    OperationalBacktestContext:
      type: object
      required:
        [
          pattern_id,
          pattern_name,
          total_trades,
          win_rate,
          profit_factor,
          sharpe,
          max_drawdown,
          expectancy,
        ]
      properties:
        pattern_id:
          type: string
        pattern_name:
          type: string
        pattern_category:
          type: string
          nullable: true
        total_trades:
          type: integer
        win_rate:
          type: number
        profit_factor:
          type: number
        sharpe:
          type: number
        max_drawdown:
          type: number
        expectancy:
          type: number
        avg_win:
          type: number
        avg_loss:
          type: number
        params:
          type: object
          additionalProperties: true
        run_at:
          type: string
          nullable: true

    OperationalEvidence:
      type: object
      required: [label, impact, detail]
      properties:
        label:
          type: string
        impact:
          type: string
          enum: [positive, neutral, negative]
        detail:
          type: string

    OperationalScenario:
      type: object
      required: [name, trigger, expected_move, action]
      properties:
        name:
          type: string
        probability:
          type: number
          nullable: true
        trigger:
          type: string
        expected_move:
          type: string
        action:
          type: string

    OperationalSetupResponse:
      type: object
      required:
        [
          symbol,
          tf,
          direction,
          decision,
          decision_label,
          decision_score,
          confidence_score,
          confluence_score,
          evidence,
          warnings,
          invalidation,
          scenarios,
          updated_at,
        ]
      properties:
        symbol:
          type: string
        tf:
          $ref: "#/components/schemas/Timeframe"
        direction:
          $ref: "#/components/schemas/TrendDirection"
        decision:
          type: string
          enum: [strong_long, long, wait, avoid, short, strong_short]
        decision_label:
          type: string
        decision_score:
          type: integer
          minimum: 0
          maximum: 100
        confidence_score:
          type: integer
          minimum: 0
          maximum: 100
        confluence_score:
          type: integer
          minimum: 0
          maximum: 100
        entry:
          type: number
          nullable: true
        stop_loss:
          type: number
          nullable: true
        take_profit:
